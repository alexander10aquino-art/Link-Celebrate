<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Digital | Link & Celebrate</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
        background: linear-gradient(135deg, #1f1c2c, #928dab);
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
    }
    .invitation-card {
        background: #ffffff;
        color: #333;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        max-width: 500px;
        width: 100%;
        overflow: hidden;
    }
    .header-bg {
        background-color: #212529;
        color: #ffc107;
        padding: 30px 20px;
        text-align: center;
    }
    .form-control, .form-select {
        min-height: 48px; /* Ideal para celulares (táctil cómodo) */
        border-radius: 8px;
    }
    .btn-gold {
        background-color: #ffc107;
        color: #000;
        font-weight: bold;
        min-height: 50px;
        border-radius: 8px;
    }
    .btn-gold:hover {
        background-color: #e0a800;
    }
  </style>
</head>
<body>

<div class="invitation-card">
  <!-- Encabezado del Evento -->
  <div class="header-bg">
    <h3 class="fw-bold mb-1" th:text="${invitacion.tituloevento}">¡Estás Invitado!</h3>
    <p class="small text-white-50 m-0"><i class="fa-regular fa-calendar-days me-1"></i> <span th:text="${invitacion.fechaEvento}">Fecha del Evento</span></p>
  </div>

  <!-- Cuerpo del Formulario de Confirmación -->
  <div class="p-4 p-md-5">
    <div class="text-center mb-4">
      <h5 class="text-secondary small text-uppercase fw-bold">Pase exclusivo para:</h5>
      <h4 class="fw-bold text-dark" th:text="${nuevoInvitado.nombreInvitado}">Nombre del Invitado</h4>
    </div>

    <form th:action="@{'/e/' + ${invitacion.slugUrl} + '/confirmar'}" method="post" th:object="${nuevoInvitado}">

      <!-- Campo oculto o visible del nombre -->
      <input type="hidden" th:field="*{nombreInvitado}">

      <!-- Teléfono -->
      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Teléfono de contacto</label>
        <input type="text" class="form-control" th:field="*{telefono}" placeholder="Tu número de teléfono" required>
      </div>

      <!-- Número de Acompañantes -->
      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Número de Acompañantes</label>
        <input type="number" class="form-control" th:field="*{acompanantes}" value="0" min="0">
      </div>

      <!-- Selección de Asistencia -->
      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">¿Nos acompañarás?</label>
        <select class="form-select" th:field="*{asistencia}" required>
          <option value="confirmado">¡Sí, ahí estaré con mucho gusto!</option>
          <option value="cancelado">Lo siento, no podré asistir</option>
        </select>
      </div>

      <!-- Comentarios / Restricciones -->
      <div class="mb-4">
        <label class="form-label small fw-bold text-muted">Comentarios o restricciones alimentarias</label>
        <textarea class="form-control" th:field="*{comentarios}" rows="2" placeholder="Ej. Alérgico al marisco..."></textarea>
      </div>

      <button type="submit" class="btn btn-gold w-100 shadow-sm">
        <i class="fa-solid fa-paper-plane me-2"></i> Enviar Confirmación
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
