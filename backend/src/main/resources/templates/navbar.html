<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<nav th:fragment="menu_superior" class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm" style="background-color: #0f172a; border-bottom: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);">
    <div class="container py-2">

        <!-- Logotipo con diseño moderno y contenedor dorado -->
        <a class="navbar-brand fw-bold d-flex align-items-center text-decoration-none" th:href="@{/}" style="letter-spacing: -0.02em;">
            <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-flex justify-content-center align-items-center me-2 shadow-sm" style="width: 38px; height: 38px; font-size: 16px;">
                <i class="fa-solid fa-champagne-glasses"></i>
            </div>
            <span class="text-white fs-5">Link <span class="text-warning">&</span> Celebrate</span>
        </a>

        <!-- Botón Toggler para Móviles -->
        <button class="navbar-toggler border-0 shadow-none text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navPerfil">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navPerfil">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-2 mt-3 mt-lg-0">

                <!-- Enlaces de Navegación -->
                <li class="nav-item">
                    <a class="nav-link text-light px-3 py-2 rounded-3 transition-all" th:href="@{/}">
                        <i class="fa-solid fa-house me-1 text-warning opacity-75"></i> Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <!-- CORRECCIÓN AQUÍ: Ruta actualizada a /plantillas-catalogo -->
                    <a class="nav-link text-light px-3 py-2 rounded-3 transition-all" th:href="@{/plantillas-catalogo}">
                        <i class="fa-solid fa-layer-group me-1 text-warning opacity-75"></i> Catálogo
                    </a>
                </li>

                <!-- VISTA 1: NO LOGUEADO -->
                <li class="nav-item ms-lg-2 my-2 my-lg-0" sec:authorize="isAnonymous()">
                    <a class="btn btn-warning fw-bold px-4 rounded-pill shadow-sm w-100 w-lg-auto" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); border: none; color: #000;" th:href="@{/login}">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Iniciar Sesión
                    </a>
                </li>

                <!-- VISTA 2: LOGUEADO -->
                <li class="nav-item dropdown ms-lg-2" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center text-white px-3 py-1.5 rounded-pill bg-dark bg-opacity-50 border border-secondary border-opacity-25" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <div class="bg-warning text-dark rounded-circle d-flex justify-content-center align-items-center shadow-sm me-2" style="width: 32px; height: 32px; font-size: 14px;">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <span class="small fw-semibold text-light" sec:authentication="name">Usuario</span>
                    </a>

                    <!-- Menú Desplegable (Dropdown) Moderno -->
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2 p-2 rounded-4" style="min-width: 230px; background-color: #ffffff;">
                        <li class="px-3 py-2 border-bottom text-center bg-light rounded-3 mb-2">
                            <span class="d-block text-muted small mb-0" style="font-size: 0.75rem;">Conectado como:</span>
                            <strong sec:authentication="name" class="text-dark text-truncate d-block fw-bold">usuario</strong>
                        </li>
                        <li>
                            <a class="dropdown-item py-2 rounded-2 fw-medium text-dark d-flex align-items-center" th:href="@{/dashboard}">
                                <i class="fa-solid fa-chart-line me-2 text-warning fs-5"></i> Mi Dashboard
                            </a>
                        </li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item py-2 text-danger fw-bold rounded-2 d-flex align-items-center">
                                    <i class="fa-solid fa-right-from-bracket me-2"></i> Cerrar Sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
