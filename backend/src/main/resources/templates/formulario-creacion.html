<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configura tu Evento | Link & Celebrate</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styleCatalogo.css(v=4.0)}">

    <style>
        :root {
            --surface-light: #ffffff;
            --accent-gold: #f59e0b;
            --accent-gold-hover: #d97706;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 10px;
            --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Tarjeta principal con efecto flotante moderno */
        .card-custom {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--surface-light);
            box-shadow: var(--shadow-float);
        }

        /* Inputs y campos de formulario optimizados para móvil y táctil */
        .form-control, .form-select {
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fdfdfd !important;
            min-height: 48px;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
            background-color: #fff !important;
        }

        /* Botón principal prémium con degradado */
        .btn-gold {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            font-weight: 700;
            border-radius: 50px;
            padding: 0.8rem 1.5rem;
            min-height: 50px;
            transition: all 0.2s ease;
            border: none;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
            color: #000;
        }

        /* Separador de sección interno */
        .section-divider {
            border-top: 1px dashed var(--border-color);
            margin: 1.5rem 0;
        }

        @media (max-width: 768px) {
            .container {
                padding-left: 12px;
                padding-right: 12px;
            }
            .card-custom {
                padding: 1.5rem !important;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{navbar :: menu_superior}"></div>

<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7">
            <div class="card card-custom p-4 p-md-5">

                <!-- Encabezado -->
                <div class="text-center mb-4">
                    <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-inline-flex justify-content-center align-items-center mb-3 shadow-sm" style="width: 65px; height: 65px; font-size: 26px;">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <h3 class="fw-bold text-dark m-0">¡Personaliza tu Evento!</h3>
                    <p class="text-muted small mt-1">Has elegido la Plantilla <span class="badge bg-dark text-warning ms-1 px-2 py-1">#<span th:text="${plantillaId}"></span></span></p>
                </div>

                <!-- Formulario -->
                <form th:action="@{/guardar-evento-vip}" method="post">                    <input type="hidden" name="paquete" th:value="${paquete}">
                    <input type="hidden" name="plantillaId" th:value="${plantillaId}">

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.75rem; letter-spacing: 0.05em;">Nombre del Evento o Festejado(s)</label>
                        <input type="text" name="nombreEvento" class="form-control" placeholder="Ej. Boda de Carlos y Ana" required>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.75rem; letter-spacing: 0.05em;">Fecha del Evento</label>
                            <input type="date" name="fechaEvento" class="form-control" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.75rem; letter-spacing: 0.05em;">Hora de la Recepción / Fiesta</label>
                            <input type="time" name="horaEvento" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.75rem; letter-spacing: 0.05em;">Lugar / Dirección de la Recepción</label>
                        <input type="text" name="lugarEvento" class="form-control" placeholder="Ej. Salón Las Orquídeas, Zona 10" required>
                    </div>

                    <!-- SECCIÓN NUEVA: IGLESIA / CEREMONIA (Opcional) -->
                    <div class="section-divider"></div>
                    <div class="mb-3">
                        <span class="badge bg-secondary bg-opacity-10 text-dark fw-bold mb-2 px-2 py-1 text-uppercase" style="font-size: 0.7rem;">Opcional (Para Bodas o Bautizos)</span>
                        <h6 class="fw-bold text-dark m-0"><i class="fa-solid fa-church text-warning me-2"></i>Detalles de la Ceremonia / Iglesia</h6>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.75rem; letter-spacing: 0.05em;">Hora de la Ceremonia</label>
                            <input type="time" name="horaIglesia" class="form-control" placeholder="Ej. 14:00">
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.75rem; letter-spacing: 0.05em;">Lugar / Dirección de la Iglesia</label>
                            <input type="text" name="lugarIglesia" class="form-control" placeholder="Ej. Parroquia San Francisco, Zona 1">
                        </div>
                    </div>
                    <!-- FIN DE SECCIÓN NUEVA -->

                    <div class="section-divider"></div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-uppercase text-muted" style="font-size: 0.75rem; letter-spacing: 0.05em;">Mensaje de Invitación</label>
                        <textarea name="mensajeEvento" class="form-control" rows="3" placeholder="Escribe un mensaje especial para tus invitados..."></textarea>
                    </div>

                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-gold shadow-sm">
                            Generar Invitación <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<!-- BOTÓN FLOTANTE DE WHATSAPP -->
<a href="https://wa.me/50236095150?text=Hola,%20tengo%20una%20duda%20al%20llenar%20mi%20formulario." class="whatsapp-float shadow-lg" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
