<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | Link & Celebrate</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Usamos el mismo estilo base de Login para mantener coherencia -->
    <link rel="stylesheet" th:href="@{/styleLogin.css}">

    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

<!-- Tarjeta del Formulario Centrada -->
<div class="login-card text-center" style="max-width: 460px;">
    <div class="mb-3">
        <i class="fa-solid fa-champagne-glasses brand-icon"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">Crea tu Cuenta</h3>
    <p class="text-muted small mb-4">Únete a Link & Celebrate y diseña tu primera invitación</p>

    <form th:action="@{/registro}" method="post">

        <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="nombreCompleto" name="nombreCompleto" placeholder="Nombre Completo" required>
            <label for="nombreCompleto"><i class="fa-solid fa-user me-2"></i>Nombre Completo</label>
        </div>

        <div class="form-floating mb-3 text-start">
            <input type="email" class="form-control" id="email" name="email" placeholder="Correo Electrónico" required>
            <label for="email"><i class="fa-solid fa-envelope me-2"></i>Correo Electrónico</label>
        </div>

        <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required>
            <label for="username"><i class="fa-solid fa-id-badge me-2"></i>Nombre de Usuario</label>
        </div>

        <div class="form-floating mb-4 text-start">
            <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
            <label for="password"><i class="fa-solid fa-lock me-2"></i>Contraseña</label>
        </div>

        <button type="submit" class="btn btn-login w-100 mb-3">
            Registrarme Gratis
        </button>
    </form>

    <div class="mt-2 pt-3 border-top">
        <p class="small text-muted mb-0">¿Ya tienes una cuenta?
            <a th:href="@{/login}" class="text-warning fw-bold text-decoration-none ms-1">Iniciar Sesión</a>
        </p>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="text-decoration-none text-muted small">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio
        </a>
    </div>
</div>

<!-- Script de Confeti en Cascada al Entrar -->
<script>
    const colors = ['#D4AF37', '#F472B6', '#1E293B', '#E2E8F0'];

    function cascadaConfeti() {
        confetti({
            particleCount: 1,
            startVelocity: 0,
            ticks: 250,
            origin: {
                x: Math.random(),
                y: -0.1
            },
            colors: colors,
            gravity: 0.4,
            scalar: 0.75,
            drift: (Math.random() - 0.5) * 0.5
        });
        requestAnimationFrame(cascadaConfeti);
    }

    window.addEventListener('load', cascadaConfeti);
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
