<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Link & Celebrate</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/styleLogin.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="login-card text-center">
    <div class="mb-3">
        <i class="fa-solid fa-champagne-glasses brand-icon"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">Crea tu Cuenta</h3>
    <p class="text-muted small mb-4">Únete a Link & Celebrate y diseña tu primera invitación</p>

    <!-- Alerta de Error -->
    <div th:if="${error}" class="alert alert-danger py-2 small mb-3" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post">
        <!-- Campo Unificado: Nombre Completo -->
        <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="nombreCompleto" name="nombreCompleto" placeholder="Nombre Completo" required>
            <label for="nombreCompleto"><i class="fa-solid fa-user me-2"></i>Nombre Completo</label>
        </div>

        <!-- Campo: Correo Electrónico -->
        <div class="form-floating mb-3 text-start">
            <input type="email" class="form-control" id="email" name="email" placeholder="Correo Electrónico" required>
            <label for="email"><i class="fa-solid fa-envelope me-2"></i>Correo Electrónico</label>
        </div>

        <!-- Campo: Teléfono -->
        <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="telefono" name="telefono" placeholder="Teléfono" required>
            <label for="telefono"><i class="fa-solid fa-phone me-2"></i>Teléfono</label>
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-floating mb-4 text-start">
            <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
            <label for="password"><i class="fa-solid fa-lock me-2"></i>Contraseña</label>
        </div>

        <button type="submit" class="btn btn-login w-100 mb-3">
            Registrarse
        </button>

        <div class="mt-2 pt-3 border-top">
            <p class="small text-muted mb-0">¿Ya tienes una cuenta?
                <a th:href="@{/login}" class="text-warning fw-bold text-decoration-none ms-1">Inicia Sesión</a>
            </p>
        </div>
    </form>

    <div class="mt-3">
        <a th:href="@{/}" class="text-decoration-none text-muted small">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
