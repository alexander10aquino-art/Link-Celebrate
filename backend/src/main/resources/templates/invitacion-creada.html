<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Invitación Creada! | Link & Celebrate</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/styleCatalogo.css(v=4.0)}">

    <style>
        :root {
            --surface-light: #ffffff;
            --accent-gold: #f59e0b;
            --accent-gold-hover: #d97706;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Contenedor principal centrado con tarjeta flotante moderna */
        .card-custom {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--surface-light);
            box-shadow: var(--shadow-float);
        }

        /* Botón principal prémium */
        .btn-gold {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000;
            font-weight: 700;
            border-radius: 50px;
            padding: 0.8rem 1.5rem;
            min-height: 50px;
            transition: all 0.2s ease;
            border: none;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
            color: #000;
        }

        /* Alerta de cuenta regresiva estilizada */
        .alert-countdown {
            background-color: #fffbeb;
            border: 1.5px dashed #fde68a;
            border-radius: 12px;
        }

        /* Ajustes específicos para móviles */
        @media (max-width: 768px) {
            .container {
                padding-left: 15px;
                padding-right: 15px;
            }
            .card-custom {
                padding: 2rem !important;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div th:replace="~{navbar :: menu_superior}"></div>

<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card card-custom p-4 p-md-5 text-center">

                <!-- Ícono animado de éxito con fondo suave -->
                <div class="mb-4">
                    <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex justify-content-center align-items-center shadow-sm" style="width: 85px; height: 85px; font-size: 38px;">
                        <i class="fa-solid fa-circle-check fa-beat" style="--fa-animation-duration: 2s;"></i>
                    </div>
                </div>

                <h2 class="fw-bold text-dark mb-2">¡Todo Listo!</h2>
                <p class="text-muted fs-6 mb-4">
                    Tu invitación para <strong class="text-dark" th:text="${nombreEvento}">tu evento</strong> ha sido generada con éxito y guardada en tu cuenta.
                </p>

                <!-- Cuenta regresiva visual moderna -->
                <div class="alert alert-countdown py-3 px-3 mb-4 d-flex align-items-center justify-content-center">
                    <div class="spinner-border spinner-border-sm text-warning me-2" role="status"></div>
                    <span id="texto-contador" class="text-dark fw-semibold small">Abriendo tu Dashboard en 4 segundos...</span>
                </div>

                <div class="d-grid">
                    <a th:href="@{/dashboard}" class="btn btn-gold shadow-sm">
                        <i class="fa-solid fa-chart-line me-2"></i> Ir ahora mismo
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT DE REDIRECCIÓN AUTOMÁTICA -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        let segundos = 4; // Segundos que tardará en saltar
        const elementoContador = document.getElementById('texto-contador');

        const intervalo = setInterval(() => {
            segundos--;
            if (segundos > 0) {
                elementoContador.innerHTML = `Abriendo tu Dashboard en ${segundos} segundos...`;
            } else {
                clearInterval(intervalo);
                elementoContador.innerHTML = `¡Allá vamos!`;
                // Esta línea es la que hace el salto automático:
                window.location.href = '/dashboard';
            }
        }, 1000); // 1000 milisegundos = 1 segundo
    });
</script>
</body>
</html>
