<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Link & Celebrate</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/styleLogin.css}">

    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<!-- Tarjeta del Formulario Centrada -->
<div class="login-card text-center">
    <div class="mb-3">
        <i class="fa-solid fa-champagne-glasses brand-icon"></i>
    </div>
    <h3 class="fw-bold text-dark mb-1">¡Bienvenido!</h3>
    <p class="text-muted small mb-4">Ingresa a tu cuenta para gestionar tus eventos</p>

    <!-- Mensajes de Alerta de Spring Security -->
    <div th:if="${param.error}" class="alert alert-danger py-2 small mb-3">
        Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-info py-2 small mb-3">
        Has cerrado sesión correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required>
            <label for="username"><i class="fa-solid fa-user me-2"></i>Usuario o Email</label>
        </div>

        <div class="form-floating mb-4 text-start">
            <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
            <label for="password"><i class="fa-solid fa-lock me-2"></i>Contraseña</label>
        </div>

        <button type="submit" class="btn btn-login w-100 mb-3">
            Iniciar Sesión
        </button>

        <div class="mt-2 pt-3 border-top">
            <p class="small text-muted mb-0">¿Aún no tienes cuenta?
                <a th:href="@{/registro}" class="text-warning fw-bold text-decoration-none ms-1">Regístrate aquí</a>
            </p>
        </div>
        <!-- Mensaje de confirmación de registro -->
        <div th:if="${param.exitoRegistro}" class="alert alert-success py-2 small mb-3">
            ¡Cuenta creada con éxito! Ya puedes iniciar sesión.
        </div>
    </form>

    <div class="mt-3">
        <a th:href="@{/}" class="text-decoration-none text-muted small">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio
        </a>
    </div>
</div>

<!-- Script de Confeti en Cascada Constante -->
<script>
    const colors = ['#D4AF37', '#F472B6', '#1E293B', '#E2E8F0'];

    function cascadaConfeti() {
        confetti({
            particleCount: 1,
            startVelocity: 0,
            ticks: 250,
            origin: {
                x: Math.random(),
                y: -0.1 // Sale desde arriba fuera de la pantalla
            },
            colors: colors,
            gravity: 0.4,
            scalar: 0.75,
            drift: (Math.random() - 0.5) * 0.5
        });
        requestAnimationFrame(cascadaConfeti);
    }

    // Iniciar la cascada automáticamente
    window.addEventListener('load', cascadaConfeti);
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
